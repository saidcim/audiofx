# audiofx preset definitions
#
# Keys a preset may use:
#   description    : shown by `audiofx presets list`
#   mode           : slow | speed | reverb | slowed_reverb
#   factor         : tempo multiplier (0.85 -> 15% slower, 1.25 -> 25% faster)
#   pitch_shift    : pitch offset in semitones (e.g. -2, +3.5)
#   preserve_pitch : true keeps the pitch while the tempo changes
#   engine         : auto | classic | rubberband
#   bass           : low shelf in dB (+6 is a firm boost, -6 thins it out)
#   treble         : high shelf in dB
#   stereo_width   : 1.0 leaves the image alone, 1.5 widens, 0 collapses to mono
#   normalize      : true brings the loudness to about -14 LUFS
#   reverb         : room / decay / predelay / mix / highpass / lowpass / ir_file
#
# About the reverb block:
#   room     small | medium | large | hall | cathedral - each is a decay time
#   decay    seconds for the tail to fall 60 dB (overrides `room`). This is the
#            one number that separates a small room from a cathedral.
#   predelay ms of silence before the tail starts; a longer gap reads as a
#            bigger room and keeps the tail off the vocal transient
#   mix      how much of the tail is mixed back in (0.35 = subtle, 0.6 = wet)
#   highpass Hz below which the tail is removed. This is what keeps the result
#            from sounding bass-boosted: low frequencies stay in the dry signal
#            only, so nothing piles up and clips.
#   lowpass  Hz above which the tail is damped, like a real room absorbing highs
#   ir_file  wav impulse response for convolution reverb (afir) instead of taps
#
# CLI flags always override preset values.

presets:
  default:
    description: "Classic slowed + reverb (the usual starting point)"
    mode: slowed_reverb
    factor: 0.85
    reverb:
      room: medium
      mix: 0.35
      highpass: 200
      lowpass: 7000

  slowed:
    description: "Slow down only; pitch drops with the tempo (classic slowed)"
    mode: slow
    factor: 0.85

  deep_slowed:
    description: "Heavier slowdown with a noticeably lower pitch"
    mode: slow
    factor: 0.75

  dreamy:
    description: "Heavy slowdown plus a long, wide reverb tail"
    mode: slowed_reverb
    factor: 0.8
    stereo_width: 1.4
    reverb:
      room: hall
      predelay: 30
      mix: 0.5
      highpass: 240
      lowpass: 6000

  cathedral:
    description: "Very slow, enormous tail - the whole track turns into a pad"
    mode: slowed_reverb
    factor: 0.7
    stereo_width: 1.6
    reverb:
      room: cathedral
      predelay: 60
      mix: 0.6
      highpass: 260
      lowpass: 5000

  nightcore:
    description: "Sped up and pitched up (nightcore)"
    mode: speed
    factor: 1.25

  sped_up:
    description: "Slightly faster, pitch stays where it is"
    mode: speed
    factor: 1.15
    preserve_pitch: true

  bass_boosted:
    description: "Slowed with a firm low shelf, levelled off afterwards"
    mode: slowed_reverb
    factor: 0.88
    bass: 6
    normalize: true
    reverb:
      room: small
      mix: 0.22
      highpass: 220
      lowpass: 7000

  lofi:
    description: "Slowed, dulled highs and a small room - tape-ish"
    mode: slowed_reverb
    factor: 0.82
    treble: -6
    bass: 3
    reverb:
      room: small
      mix: 0.3
      highpass: 200
      lowpass: 4500

  reverb_room:
    description: "Small room reverb, tempo untouched"
    mode: reverb
    factor: 1.0
    reverb:
      room: small
      mix: 0.28
      highpass: 180
      lowpass: 8000

  reverb_hall:
    description: "Concert hall reverb, tempo untouched"
    mode: reverb
    factor: 1.0
    reverb:
      room: hall
      predelay: 40
      mix: 0.35
      highpass: 220
      lowpass: 7000
